<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Z20 - Kwadrat i Sześcian</title>
</head>
<body>
<script>
    let a = parseFloat(prompt("Podaj liczbę:", ""))
    a = Math.floor(a)

    let kwadrat = Math.pow(a, 2)
    let szescian = Math.pow(a, 3)

    document.write(a + '<sup>2</sup> to: ' + kwadrat + '<br>')
    document.write(a + '<sup>3</sup> to: ' + szescian + '<br>')
</script>
</body>
</html>
