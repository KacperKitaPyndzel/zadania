<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Z39 - Tak Nie</title>
</head>
<body>
<script>
    let a = prompt(`Podaj znak:`)

    if (a == `t` || a==`T`){
        document.write(`TAK`)
    }else if(a == `n` || a == `N`)
    {
        document.write(`NIE`)
    }
</script>

</body>
</html>
