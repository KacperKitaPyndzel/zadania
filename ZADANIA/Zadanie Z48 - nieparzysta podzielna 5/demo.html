<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Zadanie Z48 - nieparzysta podzielna przez 5</title>
</head>
<body>
<script>
    let a = parseFloat(prompt(`Podaj wartosc a :`))
    let wynik1
    if (a % 2 !== 0 && a % 5 === 0) {
        wynik1 = `Tak`
    } else {
        wynik1 = `Nie`
    }

    document.write(wynik1)
</script>

</body>
</html>
