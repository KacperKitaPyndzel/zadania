<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Z40 - zupa</title>
</head>
<body>
<script>
    let nazwa = prompt(`Podaj zupe`)

    if (nazwa.toLowerCase() == `grochowa` || nazwa.toLowerCase() == `grzybowa`){
        document.write(`Wpisales` + nazwa +` - Lubie ta zupe!!!`)
    }else {
        document.write(`Wpisales` + nazwa + ` - Nie lubie ta zupe!!!`)
    }
</script>
</body>
</html>
