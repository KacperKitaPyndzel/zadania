<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Zadanie Z30 - Dzielenie ze sprawdzeniem</title>
</head>
<body>
<script>
    let a = parseFloat(prompt('Podaj liczbe a',''))
    let b = parseFloat(prompt('Podaj liczbe b',''))
    document.write('a ='+ a + '<br>')
    document.write('b ='+ b + '<br>')

    if (b == 0) {
        document.write('Nie można dzielić przez 0')
    } else {
        let iloraz = a/b
        document.write('Iloraz liczby a/b wynosi ='+ iloraz + '<br>')

    }
</script>


</body>
</html>
