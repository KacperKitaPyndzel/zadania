<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Z27 - odległość 3 punkty</title>
</head>
<body>
<script>
    let x1 = parseFloat(prompt('Podaj x1', '0'))
    let y1 = parseFloat(prompt('Podaj y1', '0'))
    let x2 = parseFloat(prompt('Podaj x2', '1'))
    let y2 = parseFloat(prompt('Podaj y2', '1'))
    let x3 = parseFloat(prompt('Podaj x3', '2'))
    let y3 = parseFloat(prompt('Podaj y3', '2'))

    let d12 = Math.sqrt(Math.pow(x1 - x2, 2) + Math.pow(y1 - y2, 2))
    let d23 = Math.sqrt(Math.pow(x2 - x3, 2) + Math.pow(y2 - y3, 2))
    let d13 = Math.sqrt(Math.pow(x1 - x3, 2) + Math.pow(y1 - y3, 2))

    document.write('P1: (' + x1 + ', ' + y1 + ')<br>')
    document.write('P2: (' + x2 + ', ' + y2 + ')<br>')
    document.write('P3: (' + x3 + ', ' + y3 + ')<br><br>')

    document.write('Odległość P1 - P2 = ' + d12.toFixed(2) + '<br>')
    document.write('Odległość P2 - P3 = ' + d23.toFixed(2) + '<br>')
    document.write('Odległość P1 - P3 = ' + d13.toFixed(2) + '<br>')
</script>
</body>
</html>
