<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zadanie T17b</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<form action="contest.php" method="post">
    <fieldset>
        <legend>Podstawowe Dane:</legend>
        <ul>
            <li><label for="form-name">Imię i nazwisko: </label> <input type="text" name="username" id="form-name"></li>
            <li><label for="form-email">E-mail:</label> <input type="email" name="emailaddress" id="form-email"></li>
            <li><label for="form-tel">Telefon: </label> <input type="tel" name="telefon" id="form-tel"></li>
            <li>
                <label for="form-story">Moje buty są ...</label><br>
                <textarea name="story" rows="4" cols="60" maxlength="300" id="form-story" placeholder="Nie więcej niż 300 znaków"></textarea>
            </li>
        </ul>

        <h2>Zaprojektuj własne Trampki:</h2>

        <fieldset>
            <legend>Własny projekt butów:</legend>

            <fieldset>
                <legend>Kolor <em>(Jeden do wyboru)</em>:</legend>
                <ul>
                    <li><label><input type="radio" name="color" value="red"> Czerwony</label></li>
                    <li><label><input type="radio" name="color" value="blue"> Niebieski</label></li>
                    <li><label><input type="radio" name="color" value="black"> Czarny</label></li>
                    <li><label><input type="radio" name="color" value="brown"> Brązowy</label></li>
                </ul>
            </fieldset>

            <fieldset>
                <legend>Opcje <em>(Kilka do wyboru):</em></legend>
                <ul>
                    <li><label><input type="checkbox" name="features[]" value="laces"> Kolorowe Sznurówki</label></li>
                    <li><label><input type="checkbox" name="features[]" value="logo"> Drewniane logo</label></li>
                    <li><label><input type="checkbox" name="features[]" value="heels"> Świecące podeszwy</label></li>
                </ul>
            </fieldset>

            <fieldset>
                <legend>Rozmiar</legend>
                <p>
                    <label for="shoe-size">Rozmiar butów (UE):</label>
                    <select name="size" id="shoe-size" size="1">
                        <option>37</option>
                        <option>38</option>
                        <option>39</option>
                        <option>40</option>
                        <option>41</option>
                        <option>42</option>
                        <option>43</option>
                        <option>44</option>
                        <option>45</option>
                        <option>46</option>
                        <option>47</option>
                    </select>
                </p>
            </fieldset>
        </fieldset>

        <p>
            <input type="submit" value="Zaprojektuj swoje buty!">
            <input type="reset" value="Wyczyść">
        </p>
    </fieldset>
</form>
</body>
</html>
